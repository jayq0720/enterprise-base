    - id: f_stats
      type: custom
      position:
        x: 1800
        y: 1250
      data:
        type: code
        title: 整理结果
        code_language: python3
        code: |
          def main(out: list) -> dict:
              """把 X4 的结果整理成给员工看的文字（模型看不到这些数据）。"""
              data = out[0] if out else {}
              if not data:
                  return {"text": "询盘系统暂时不可用，请稍后再试。"}
              if data.get("error"):
                  return {"text": data["error"]}

              def part(title: str, values: dict) -> str:
                  items = sorted((values or {}).items(), key=lambda kv: -kv[1])
                  return title + "：" + ("，".join(f"{k} {v}" for k, v in items) or "无")

              avg = data.get("avg_first_response_minutes")
              lines = [
                  f"最近 {data.get('days')} 天新进询盘 {data.get('total', 0)} 条"
                  + (f"，平均首次响应 {round(avg)} 分钟。" if avg is not None else "。"),
                  part("按渠道", data.get("by_channel")),
                  part("按等级", data.get("by_grade")),
                  part("按 AI 引擎来源", data.get("by_ai_engine")),
                  part("按状态", data.get("by_status")),
              ]
              funnel = data.get("funnel") or {}
              unit = data.get("currency") or ""

              def conv(title: str, groups: dict) -> str:
                  items = sorted((groups or {}).items(), key=lambda kv: -kv[1].get("total", 0))
                  rows = [
                      f"{k} 询盘 {v.get('total', 0)}、有效 {v.get('valid', 0)}、转商机 {v.get('opportunity', 0)}、"
                      f"成交 {v.get('won', 0)}（{v.get('revenue', 0):,.2f} {unit}）"
                      for k, v in items
                  ]
                  return title + "：" + ("；".join(rows) or "无")

              if funnel:
                  total = funnel.get("all") or {}
                  lines.append(
                      f"转化：有效 {total.get('valid', 0)}，已跟进 {total.get('responded', 0)}，"
                      f"转商机 {total.get('opportunity', 0)}，成交 {total.get('won', 0)} 单，"
                      f"成交额 {total.get('revenue', 0):,.2f} {unit}"
                  )
                  lines.append(conv("转化按渠道", funnel.get("by_channel")))
                  lines.append(conv("转化按 AI 引擎来源", funnel.get("by_ai_engine")))
              return {"text": "\n".join(lines)}
        variables:
        - variable: out
          value_selector:
          - t_stats
          - json
        outputs:
          text:
            type: string
            children: null
