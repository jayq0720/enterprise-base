        - case_id: 'true'
          conditions:
          - comparison_operator: '='
            id: has-records
            value: '1'
            varType: number
            variable_selector:
            - p_fmt
            - has_records
          id: 'true'
          logical_operator: and
        title: 有没有检索到
        type: if-else
      id: p_check
      position:
        x: 2100
        y: 800
      type: custom
    - data:
