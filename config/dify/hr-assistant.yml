              status = {"Open": "审批中", "Approved": "已批准", "Rejected": "已驳回", "Cancelled": "已取消"}
              lines = ["你最近的请假申请："]
              stage = {"manager": "主管审批中", "hr": "HR 审批中", "returned": "已退回，请修改后重新提交"}
