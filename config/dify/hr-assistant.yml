        title: 按岗位检索
        type: http-request
        url: '{{#env.x3_url#}}/v1/search'
        variables: []
      id: p_x3
      position:
        x: 1500
        y: 800
      type: custom
    - data:
        code: |
          import json


          def main(status_code: int, body: str) -> dict:
              """把 X3 的检索结果整理成模型上下文和出处列表。"""
              unavailable = "知识库检索暂时不可用，请稍后再试。"
              if status_code != 200:
                  return {"has_records": 0, "context": "", "refs": "", "notice": unavailable}
              try:
                  data = json.loads(body)
              except ValueError:
                  return {"has_records": 0, "context": "", "refs": "", "notice": unavailable}
              records = data.get("records") or []
              if not records:
                  notice = data.get("notice") or "没有找到相关制度。可以换个说法再问，或联系 HR。"
                  return {"has_records": 0, "context": "", "refs": "", "notice": notice}
              blocks, refs, seen = [], [], []
              for i, r in enumerate(records, 1):
                  title = r.get("title", "")
                  blocks.append(f"[{i}]《{title}》（{r.get('space', '')}）\n{r.get('content', '')}")
                  if title not in seen:
                      seen.append(title)
                      refs.append(f"[{i}]《{title}》")
              return {
                  "has_records": 1,
                  "context": "\n\n".join(blocks),
                  "refs": "\n".join(refs),
                  "notice": "",
              }
        code_language: python3
        outputs:
          context:
            children: null
            type: string
          has_records:
            children: null
            type: number
          notice:
            children: null
            type: string
          refs:
            children: null
            type: string
        title: 整理检索结果
        type: code
        variables:
        - value_selector:
          - p_x3
          - status_code
          variable: status_code
        - value_selector:
          - p_x3
          - body
          variable: body
      id: p_fmt
      position:
        x: 1800
        y: 800
      type: custom
    - data:
