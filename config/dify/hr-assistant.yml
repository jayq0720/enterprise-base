          - conversation
          - leave_draft
          input_type: variable
          operation: clear
          value: null
    - id: a_confirm
      type: custom
      position:
        x: 1500
        y: 0
      data:
        type: answer
        title: 回复提交结果
        answer: '{{#confirm_msg.text#}}'
        variables: []
    - id: session
      type: custom
      position:
        x: 600
        y: 300
      data:
        type: http-request
        title: 换会话令牌
        method: post
        url: '{{#env.x4_url#}}/v1/session'
        authorization:
          type: no-auth
          config: null
        headers: Authorization:Bearer {{#env.x4_token#}}
        params: ''
        body:
          type: json
