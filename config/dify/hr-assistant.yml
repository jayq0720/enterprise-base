        timeout:
          max_connect_timeout: 5
          max_read_timeout: 10
          max_write_timeout: 5
        variables: []
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 500
        error_strategy: default-value
        default_value:
        - key: status_code
          type: number
          value: 503
        - key: body
          type: string
          value: ''
        - key: headers
          type: object
          value: {}
    - id: token
      type: custom
      position:
        x: 900
        y: 300
      data:
        type: code
        title: 取令牌和日期
        code_language: python3
        code: |
          import datetime
          import json


          def main(body: str) -> dict:
              """取出会话令牌；顺便给出北京时间今天的日期，供起草请假时换算“明天”“下周一”。"""
              today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).date()
              try:
                  token = json.loads(body).get("session_token", "")
              except ValueError:
                  token = ""
              return {"token": token, "today": today.isoformat() + " 星期" + "一二三四五六日"[today.weekday()]}
        variables:
        - variable: body
          value_selector:
          - session
          - body
        outputs:
          token:
            type: string
            children: null
          today:
            type: string
            children: null
