    - id: f_draft
      type: custom
      position:
        x: 2100
        y: 1700
      data:
        type: code
        title: 整理草稿
        code_language: python3
        code: |
          def main(out: list) -> dict:
              """把 X4 的结果整理成给员工看的文字。"""
              data = out[0] if out else {}
              if not data:
                  return {"text": "HR 系统暂时不可用，请稍后再试。", "draft_token": ""}
              if data.get("error"):
                  types = "、".join(data.get("leave_types") or [])
                  hint = f"可选的假期类型：{types}。" if types else ""
                  return {"text": data["error"] + hint, "draft_token": ""}
              d = data["draft"]
              left = data.get("remaining")
              left_text = f"，目前剩余 {'%g' % left} 天" if left is not None else ""
              reason = f"，事由：{d['reason']}" if d.get("reason") else ""
              text = (
                  f"请核对请假信息：{d['leave_type']}，{d['from_date']} 至 {d['to_date']}{reason}{left_text}。\n"
                  "确认无误请回复“确认请假”，10 分钟内有效；有不对的地方直接重新说。"
              )
              return {"text": text, "draft_token": data["draft_token"]}
        variables:
        - variable: out
          value_selector:
          - t_draft
          - json
        outputs:
          text:
            type: string
            children: null
          draft_token:
            type: string
            children: null
