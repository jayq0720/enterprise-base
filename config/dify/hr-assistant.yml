# HR 助手（Dify Chatflow）。由 P2-C2 生成，说明见同目录 README.md。
# 模型插件和 MCP 服务不在这里写死：导入前先装好通义千问插件并录入 Key，
# 在“工具 → MCP”里添加 X4（服务标识填 eb-hr），导入后在“环境变量”里填地址和 Token。
app:
  description: 企业微信里的 HR 助手：问制度（按岗位检索，附出处）、查假期和请假进度、查待我审批、查岗位职责、发起请假（员工确认后才提交）。
  icon: 🧑‍💼
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: HR 助手
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables:
  - description: 等待员工确认的请假草稿（X4 签名，10 分钟有效）
    id: 6c1d7b9f-7a4f-4b1f-8b6a-2d4f4d3b3d01
    name: leave_draft
    selector:
    - conversation
    - leave_draft
    value: ''
    value_type: string
  environment_variables:
  - description: X3 按岗位检索服务的地址，例如 http://kb-gateway:8080
    id: 5b0c6a8e-6f3e-4a0e-9a59-1c3f0e3c2a01
    name: x3_url
    selector:
    - env
    - x3_url
    value: http://kb-gateway:8080
    value_type: string
  - description: X3 的服务间 Token（EB_KB_SERVICE_TOKEN），导入后在“环境变量”里填写，不进仓库
    id: 5b0c6a8e-6f3e-4a0e-9a59-1c3f0e3c2a02
    name: x3_token
    selector:
    - env
    - x3_token
    value: ''
    value_type: secret
  - description: X4 员工 HR 查询服务的地址，例如 http://frappe-mcp:8080
    id: 6c1d7b9f-7a4f-4b1f-8b6a-2d4f4d3b3c01
    name: x4_url
    selector:
    - env
    - x4_url
    value: http://frappe-mcp:8080
    value_type: string
  - description: X4 的服务间 Token（EB_MCP_SERVICE_TOKEN），导入后在“环境变量”里填写，不进仓库
    id: 6c1d7b9f-7a4f-4b1f-8b6a-2d4f4d3b3c02
    name: x4_token
    selector:
    - env
    - x4_token
    value: ''
    value_type: secret
  features:
    file_upload: {}
    opening_statement: 你好，我是 HR 助手。可以问我公司制度、查假期余额和请假进度、查岗位职责，也可以帮你发起请假。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 300
      data:
        type: start
        title: 开始
        variables: []
    - id: is_confirm
      type: custom
      position:
        x: 300
        y: 300
      data:
        type: if-else
        title: 是不是确认请假
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: q
            variable_selector:
            - sys
            - query
            comparison_operator: is
            value: 确认请假
            varType: string
          - id: d
            variable_selector:
            - conversation
            - leave_draft
            comparison_operator: not empty
            value: ''
            varType: string
        - case_id: no_draft
          id: no_draft
          logical_operator: and
          conditions:
          - id: q2
            variable_selector:
            - sys
            - query
            comparison_operator: is
            value: 确认请假
            varType: string
    - id: a_no_draft
      type: custom
      position:
        x: 600
        y: -150
      data:
        type: answer
        title: 没有草稿
        answer: 没有等你确认的请假，或者草稿已经过期。请重新说一下要请什么假、哪几天。
        variables: []
    - id: confirm
      type: custom
      position:
        x: 600
        y: 0
      data:
        type: http-request
        title: 提交请假
        method: post
        url: '{{#env.x4_url#}}/v1/leave/confirm'
        authorization:
          type: no-auth
          config: null
        headers: Authorization:Bearer {{#env.x4_token#}}
        params: ''
        body:
          type: json
          data:
          - type: text
            value: '{"user_id": "{{#sys.user_id#}}", "draft_token": "{{#conversation.leave_draft#}}"}'
        timeout:
          max_connect_timeout: 5
          max_read_timeout: 15
          max_write_timeout: 5
        variables: []
        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 500
        error_strategy: default-value
        default_value:
        - key: status_code
          type: number
          value: 503
        - key: body
          type: string
          value: ''
        - key: headers
          type: object
          value: {}
    - id: confirm_msg
      type: custom
      position:
        x: 900
        y: 0
      data:
        type: code
        title: 提交结果
        code_language: python3
        code: |
          import json


          def main(status_code: int, body: str) -> dict:
              """把 X4 的提交结果转成给员工的一句话。"""
              if status_code != 200:
                  return {"text": "HR 系统暂时不可用，请稍后再试。"}
              try:
                  data = json.loads(body)
              except ValueError:
                  return {"text": "HR 系统暂时不可用，请稍后再试。"}
              return {"text": data.get("message") or data.get("error") or "HR 系统暂时不可用，请稍后再试。"}
        variables:
        - variable: status_code
          value_selector:
          - confirm
          - status_code
        - variable: body
          value_selector:
          - confirm
          - body
        outputs:
          text:
            type: string
            children: null
    - id: clear_draft
      type: custom
      position:
        x: 1200
        y: 0
      data:
        type: assigner
        title: 清空草稿
        version: '2'
        items:
