        code_language: python3
        code: |
          def main(out: list) -> dict:
              """把 X4 的结果整理成给员工看的文字。"""
              data = out[0] if out else {}
              if not data:
                  return {"text": "HR 系统暂时不可用，请稍后再试。"}
              if data.get("error"):
                  return {"text": data["error"]}
              rows = data.get("balances") or []
              if not rows:
                  return {"text": "你目前没有可用的假期额度。"}
              lines = [f"{data.get('employee_name', '')}的假期余额："]
              for r in rows:
                  lines.append(
                      f"· {r['leave_type']}：剩余 {('%g' % (r.get('remaining') or 0))} 天"
                      f"（总额 {('%g' % (r.get('total') or 0))}，已休 {('%g' % (r.get('taken') or 0))}，审批中 {('%g' % (r.get('pending_approval') or 0))}）"
                  )
              return {"text": "\n".join(lines)}
