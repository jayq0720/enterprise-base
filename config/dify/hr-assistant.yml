              data = out[0] if out else {}
              if not data:
                  return {"text": "HR 系统暂时不可用，请稍后再试。"}
              if data.get("error"):
                  return {"text": data["error"]}
              more = "\n（内容较长，只显示了前面一部分，完整内容请到 HR 系统查看。）" if data.get("truncated") else ""
              duties = data.get("responsibilities", "")
              return {"text": f"你的岗位是{data.get('designation', '')}，岗位职责：\n{duties}{more}"}
        variables:
        - variable: out
          value_selector:
          - t_duties
          - json
        outputs:
          text:
            type: string
            children: null
