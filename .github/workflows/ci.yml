# CI：PR 和推 main 时运行。说明见 docs/CI.md。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # 每个 services/<name>/ 下有 pyproject.toml 的都是一个独立服务
        run: |
          services=$(find services -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "services=$services" >> "$GITHUB_OUTPUT"

  python:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - name: 依赖许可证检查（只看运行时依赖）
        run: |
          uv sync --frozen --no-dev --python 3.12
          name=$(uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          uv run --no-sync --with pip-licenses pip-licenses --from=mixed --partial-match \
            --allow-only="MIT;BSD;Apache;ISC;Mozilla Public License 2.0;MPL-2.0;PSF;Python Software Foundation;LGPL" \
            --ignore-packages "$name" pip-licenses prettytable wcwidth

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 密钥扫描
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner -v

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: 完整部署隔离校验
        run: make -C deploy verify
