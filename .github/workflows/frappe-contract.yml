name: frappe-contract
on:
  pull_request:
    paths: ['frappe_apps/**', 'config/frappe/**', '.github/workflows/frappe-contract.yml', 'deploy/ci-frappe*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frappe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.11.32'
      - name: App 静态检查
        working-directory: frappe_apps/enterprise_base
        run: |
          uv sync --frozen --python 3.12
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy enterprise_base
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: base
        with:
          path: deploy/data/ci-frappe.tar.gz
          key: frappe-gzip-3556154-py3.12.12-v15.123.1-${{ hashFiles('deploy/apps.lock.json') }}
      - name: 释放临时 runner 未使用的 SDK 空间
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - name: 真实站点测试、导出和空库导入
        id: contract
        run: bash deploy/ci-frappe.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.base.outputs.cache-hit != 'true'
        with:
          path: deploy/data/ci-frappe.tar.gz
          key: frappe-gzip-3556154-py3.12.12-v15.123.1-${{ hashFiles('deploy/apps.lock.json') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frappe-fixtures
          path: artifacts/*.json
          retention-days: 3
